<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>だっしゅつゲーム</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 画面1: タイトル画面 -->
  <section id="screen-title" class="screen is-active">
    <div class="card title-card">
      <h1 class="app-title">🔐 だっしゅつゲーム 🔑</h1>
      <p class="app-sub">なぞをといて、さいごまで だっしゅつしよう！</p>
      <button id="btn-start" class="btn btn-primary btn-large" type="button">▶ はじめる</button>
    </div>
  </section>

  <!-- 画面2: ステージ画面 -->
  <section id="screen-stage" class="screen">
    <div class="stage-topbar">
      <div class="progress-wrap" aria-label="進み具合">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-label" class="progress-label">1 / 3</span>
      </div>
    </div>

    <div class="card stage-card">
      <h2 id="stage-title" class="stage-title">ステージタイトル</h2>
      <p id="stage-prompt" class="stage-prompt">もんだいぶん</p>

      <img id="stage-image" class="stage-image" alt="" hidden />

      <div id="stage-body" class="stage-body">
        <!-- ここに type ごとの選択肢/入力欄/並べ替えUIが差し込まれる -->
      </div>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

      <div id="hint-panel" class="hint-panel" hidden>
        <p id="hint-text" class="hint-text"></p>
      </div>

      <div class="stage-actions">
        <button id="btn-hint" class="btn btn-secondary" type="button">💡 ヒント</button>
      </div>
    </div>
  </section>

  <!-- 画面3: 最終演出（クリア）画面 -->
  <section id="screen-clear" class="screen">
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
    <div class="card clear-card">
      <h1 class="clear-title">🎉 だっしゅつ せいこう！ 🎉</h1>
      <p class="clear-sub">すべての なぞを といたね。すごい！</p>

      <button id="btn-reveal" class="btn btn-primary btn-large">🎁 しゃしんを 見る</button>

      <div id="photo-wrap" class="photo-wrap" hidden>
        <img id="final-photo" class="final-photo" alt="さいごのごほうびしゃしん" />
        <div id="photo-fallback" class="photo-fallback" hidden>
          <p>📷 写真が見つかりません</p>
          <p class="photo-fallback-sub">assets/final-photo.jpg（または .png）に画像を置いてください。</p>
        </div>
      </div>

      <button id="btn-restart" class="btn btn-secondary" type="button" hidden>🔁 もういちど さいしょから</button>
    </div>
  </section>

  <script src="stages.js"></script>
  <script src="main.js"></script>
</body>
</html>
