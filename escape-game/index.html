<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>だっしゅつゲーム</title>
<link rel="stylesheet" href="style.css?v=5" />
</head>
<body>

  <!-- 効果音のON/OFF切り替え（教室で複数台同時に使うことを想定した控えめな配置） -->
  <button id="btn-mute" class="btn-mute" type="button" aria-label="おとの ON/OFF">🔊</button>

  <!-- かいじゅうが放つ「咆哮」に合わせて、画面ぜんたいをうっすら赤く光らせる演出 -->
  <div id="roar-flash" class="roar-flash" aria-hidden="true"></div>

  <!-- 画面のすみで明滅する、警戒サイレンのような赤い光の演出 -->
  <div class="kaiju-alert" aria-hidden="true"></div>

  <!-- もらった「感謝」ポスターの、上部にある赤い筆あとを模した装飾 -->
  <div class="paint-stroke" aria-hidden="true"></div>

  <!-- 背景の装飾（かいじゅう・まち・炎・稲光などが漂う演出。操作の邪魔をしないようpointer-events:none） -->
  <div class="bg-decor" aria-hidden="true">
    <span class="bg-decor-item" style="--x:8%; --y:10%; --dur:16s; --delay:0s;">🦖</span>
    <span class="bg-decor-item" style="--x:82%; --y:16%; --dur:19s; --delay:-3s;">⚡</span>
    <span class="bg-decor-item" style="--x:15%; --y:74%; --dur:21s; --delay:-8s;">🔥</span>
    <span class="bg-decor-item" style="--x:88%; --y:66%; --dur:17s; --delay:-5s;">🏙️</span>
    <span class="bg-decor-item" style="--x:50%; --y:84%; --dur:23s; --delay:-11s;">💥</span>
    <span class="bg-decor-item" style="--x:65%; --y:6%; --dur:18s; --delay:-14s;">🌋</span>
  </div>

  <!-- 画面下に敷く、まちのシルエット（かいじゅうに壊される前の街並みイメージ） -->
  <svg class="city-skyline" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
    <rect x="0" y="30" width="30" height="30" />
    <rect x="28" y="16" width="22" height="44" />
    <rect x="52" y="26" width="18" height="34" />
    <rect x="72" y="8" width="26" height="52" />
    <rect x="100" y="22" width="20" height="38" />
    <rect x="122" y="34" width="24" height="26" />
    <rect x="148" y="14" width="18" height="46" />
    <rect x="168" y="28" width="30" height="32" />
    <rect x="200" y="18" width="20" height="42" />
    <rect x="222" y="32" width="22" height="28" />
    <rect x="246" y="6" width="24" height="54" />
    <rect x="272" y="24" width="18" height="36" />
    <rect x="292" y="36" width="26" height="24" />
    <rect x="320" y="16" width="20" height="44" />
    <rect x="342" y="28" width="18" height="32" />
    <rect x="362" y="20" width="20" height="40" />
    <rect x="384" y="32" width="16" height="28" />
    <circle class="city-window" cx="38" cy="30" r="1.6" />
    <circle class="city-window" cx="84" cy="20" r="1.6" />
    <circle class="city-window" cx="112" cy="34" r="1.6" />
    <circle class="city-window" cx="156" cy="26" r="1.6" />
    <circle class="city-window" cx="210" cy="30" r="1.6" />
    <circle class="city-window" cx="256" cy="18" r="1.6" />
    <circle class="city-window" cx="300" cy="44" r="1.6" />
    <circle class="city-window" cx="330" cy="28" r="1.6" />
    <circle class="city-window" cx="370" cy="32" r="1.6" />
  </svg>

  <!-- 画面1: タイトル画面 -->
  <section id="screen-title" class="screen is-active">
    <div class="card title-card">
      <div class="title-icon-row" aria-hidden="true">
        <span class="title-icon title-icon-kaiju">🦖</span>
        <span class="title-icon title-icon-city">🏙️</span>
      </div>
      <h1 class="app-title">だっしゅつゲーム</h1>
      <p class="app-sub">かいじゅうが せまる まちから、なぞをといて だっしゅつしよう！</p>
      <button id="btn-start" class="btn btn-primary btn-large" type="button">▶ はじめる</button>
    </div>
  </section>

  <!-- 画面2: ステージ画面 -->
  <section id="screen-stage" class="screen">
    <div class="stage-topbar">
      <div class="progress-wrap" aria-label="進み具合">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-label" class="progress-label">1 / 3</span>
        <span id="elapsed-time" class="elapsed-time" aria-label="けいかじかん">⏱ 0:00</span>
      </div>
      <div id="progress-dots" class="progress-dots" aria-hidden="true">
        <!-- ステージごとのアイコンドットがJSで生成される -->
      </div>
    </div>

    <div class="card stage-card">
      <div class="stage-header">
        <span id="stage-icon" class="stage-icon-badge" aria-hidden="true">🧩</span>
        <h2 id="stage-title" class="stage-title">ステージタイトル</h2>
      </div>
      <p id="stage-prompt" class="stage-prompt">もんだいぶん</p>

      <img id="stage-image" class="stage-image" alt="" hidden />

      <div id="stage-body" class="stage-body">
        <!-- ここに type ごとの選択肢/入力欄/並べ替えUIが差し込まれる -->
      </div>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

      <div id="hint-panel" class="hint-panel" hidden>
        <p id="hint-text" class="hint-text"></p>
      </div>

      <div class="stage-actions">
        <button id="btn-hint" class="btn btn-secondary" type="button">💡 ヒント</button>
      </div>
    </div>
  </section>

  <!-- 画面3: 最終演出（クリア）画面 -->
  <section id="screen-clear" class="screen">
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
    <div class="card clear-card">
      <div class="clear-trophy" aria-hidden="true">🦖</div>
      <h1 class="clear-title">だっしゅつ せいこう！</h1>
      <p class="clear-sub">かいじゅうから ぶじに にげきれたね。すごい！</p>
      <p id="clear-time" class="clear-time">🕒 クリアタイム：計測中…</p>

      <button id="btn-reveal" class="btn btn-primary btn-large">🎁 しゃしんを 見る</button>

      <div id="photo-wrap" class="photo-wrap" hidden>
        <div class="photo-frame">
          <img id="final-photo" class="final-photo" alt="さいごのごほうびしゃしん" />
          <div id="photo-fallback" class="photo-fallback" hidden>
            <p>📷 写真が見つかりません</p>
            <p class="photo-fallback-sub">assets/final-photo.jpg（または .png）に画像を置いてください。</p>
          </div>
        </div>
      </div>

      <button id="btn-restart" class="btn btn-secondary" type="button" hidden>🔁 もういちど さいしょから</button>
    </div>
  </section>

  <script src="stages.js?v=5"></script>
  <script src="sfx.js?v=5"></script>
  <script src="main.js?v=5"></script>
</body>
</html>
