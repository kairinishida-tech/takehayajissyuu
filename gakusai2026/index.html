<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dre@m 学祭2026 フライヤー</title>
<style>
  :root { --bg: #1c2752; --ink: #f3ecb0; --sub: #c9c39a; --card: rgba(255,255,255,.07); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px; text-align: center;
  }
  .sub { color: var(--sub); letter-spacing: .15em; font-size: 13px; margin: 0; }
  h1 { font-size: clamp(32px, 11vw, 48px); margin: 8px 0 4px; letter-spacing: .04em; white-space: nowrap; }
  p.lead { color: var(--sub); margin: 0 0 32px; font-size: 14px; }
  .days { display: grid; gap: 16px; width: 100%; max-width: 360px; }
  a.day {
    display: block; padding: 22px 16px; border-radius: 16px; background: var(--card);
    border: 1.5px solid rgba(243,236,176,.35); color: var(--ink); text-decoration: none;
  }
  a.day.today { border-color: var(--ink); background: rgba(243,236,176,.14); }
  a.day b { display: block; font-size: 34px; letter-spacing: .05em; }
  a.day span { font-size: 14px; color: var(--sub); }
  a.day em { font-style: normal; font-size: 12px; margin-left: 6px; color: var(--ink); }
  footer { margin-top: 40px; color: var(--sub); font-size: 12px; letter-spacing: .1em; }
</style>
</head>
<body>
  <p class="sub">School Festival 2026</p>
  <h1>✦ Dre@m ✦</h1>
  <p class="lead">見たい日のフライヤーをタップ</p>
  <div class="days">
    <a class="day" href="1101.pdf" data-date="2026-11-01"><b>11/1</b><span>1日目 タイムテーブル</span></a>
    <a class="day" href="1102.pdf" data-date="2026-11-02"><b>11/2</b><span>2日目 タイムテーブル</span></a>
  </div>
  <footer>after Beer 2026</footer>
<script>
  // 当日のボタンを強調
  const d = new Date(), today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  document.querySelectorAll("a.day").forEach(a => {
    if (a.dataset.date === today) { a.classList.add("today"); a.querySelector("span").insertAdjacentHTML("beforeend", "<em>本日</em>"); }
  });
</script>
</body>
</html>
